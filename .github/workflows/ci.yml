name: CI
on:
    push:
    pull_request:
    schedule:
        - cron: '0 2 * * 0'

env:
    OPENSSL_BRANCH: openssl-3.6.0
    USE_RPATH: yes
    PATCH_OPENSSL: 1
    GOST_PROVIDER_ENABLE_ONLINE_TESTS: 1
    GOST_ENABLE_LEGACY: ON

jobs:
    gcc-openssl-stable:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh

    clang-openssl-stable:
        runs-on: ubuntu-latest
        env:
            CC: clang
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh

    macos-openssl-stable:
        runs-on: macos-latest
        env:
            USE_RPATH:

            GOST_PROVIDER_ENABLE_ONLINE_TESTS: 0 # macOS runner has no network access to infotecs TLS1.3 server
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh

    gcc-openssl-master:
        runs-on: ubuntu-latest
        env:
            OPENSSL_BRANCH: master
            GOST_ENABLE_LEGACY: OFF
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh

    clang-openssl-master:
        runs-on: ubuntu-latest
        env:
            CC: clang
            OPENSSL_BRANCH: master
            GOST_ENABLE_LEGACY: OFF
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh

    macos-openssl-master:
        runs-on: macos-latest
        env:
            OPENSSL_BRANCH: master
            GOST_ENABLE_LEGACY: OFF
            USE_RPATH:
            GOST_PROVIDER_ENABLE_ONLINE_TESTS: 0 # macOS runner has no network access to infotecs TLS1.3 server
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh

    gcc-asan-openssl-master:
        runs-on: ubuntu-latest
        env:
            OPENSSL_BRANCH: master
            GOST_ENABLE_LEGACY: OFF
            ASAN: -DASAN=1
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh

    macos-asan-openssl-master:
        runs-on: macos-latest
        env:
            OPENSSL_BRANCH: master
            GOST_ENABLE_LEGACY: OFF
            ASAN: -DASAN=1
            USE_RPATH:
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh

    gcc-openssl-stable-x86:
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'schedule' }}
        env:
            CFLAGS: -m32
            LDFLAGS: -m32
            SETARCH: "setarch i386"
            APT_INSTALL: gcc-multilib
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh

    gcc-openssl-master-x86:
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'schedule' }}
        env:
            CFLAGS: -m32
            LDFLAGS: -m32
            SETARCH: "setarch i386"
            APT_INSTALL: gcc-multilib
            OPENSSL_BRANCH: master
            GOST_ENABLE_LEGACY: OFF
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - run: .github/before-script.sh
            - run: .github/build-engine.sh
